    <title>Pasaporte de Recuperación | VOLVER – Recuperación Real</title>
    <meta name="theme-color" content="#0B0F15">

    <!-- Google Fonts: Inter -->

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS -->

            theme: {
                extend: {
                    fontFamily: {

        }

</head>
<body class="min-h-screen text-slate-100 font-sans antialiased selection:bg-sky-400/30 selection:text-sky-200 overflow-x-hidden">

                        <svg class="w-4 h-4 text-sky-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>

                            type="button"

                            class="slogan-chip px-2.5 py-1.5 rounded-lg text-[11px] font-medium border text-left transition-all duration-150 active:scale-[0.98]"

                            Tu recuperación es el objetivo

                        <button

                            class="slogan-chip px-2.5 py-1.5 rounded-lg text-[11px] font-medium border text-left transition-all duration-150 active:scale-[0.98]"

                            Menos dolor, más vida

                        <button

                        <!-- 1. Descargar PNG -->

                                <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/>

                        <!-- 2. Compartir (WhatsApp) y 3. Copiar Mensaje -->

    <!-- Toast de Notificación Flotante -->
    <div
        id="toast"
        role="status"
        aria-live="polite"
        class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-[#131A24]/95 border border-sky-400/40 text-sky-100 text-xs font-semibold shadow-2xl backdrop-blur-md flex items-center gap-2 opacity-0 pointer-events-none translate-y-3 transition-all duration-200 max-w-[90vw] text-center"
    >
        <svg class="w-4 h-4 text-sky-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"/>
        </svg>
        <span id="toastText">Listo</span>
    </div>

    <script>
        (function () {
            'use strict';

            // =========================================================================
            // ESTADO GLOBAL DE LA APLICACIÓN
            // =========================================================================
            const DEFAULT_SLOGAN = 'Cada sesión te acerca a volver a vivir sin dolor.';
            const FONT_FAMILY = "'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif";

            const state = {
                name: '',
                zone: '',
                session: 1, // 1, 2, 3 o 4
                reward: 'Ozonoterapia de regalo',
                footerSlogan: DEFAULT_SLOGAN
            };

            // Referencias del DOM
            const canvas = document.getElementById('passportCanvas');
            const ctx = canvas.getContext('2d');
            const nameInput = document.getElementById('patientName');
            const zoneInput = document.getElementById('patientZone');
            const sessionBtns = document.querySelectorAll('.session-btn');
            const rewardPreset = document.getElementById('rewardPreset');
            const rewardInput = document.getElementById('rewardText');
            const footerSloganInput = document.getElementById('footerSlogan');
            const sloganChips = document.querySelectorAll('.slogan-chip');
            const wppMessagePreview = document.getElementById('wppMessagePreview');
            const downloadBtn = document.getElementById('downloadBtn');
            const shareBtn = document.getElementById('shareBtn');
            const copyMsgBtn = document.getElementById('copyMsgBtn');
            const copyBtnLabel = document.getElementById('copyBtnLabel');
            const resetBtn = document.getElementById('resetBtn');
            const toastEl = document.getElementById('toast');
            const toastTextEl = document.getElementById('toastText');

            let toastTimer = null;

            // =========================================================================
            // UTILIDADES DE DIBUJO EN CANVAS
            // =========================================================================

            /**
             * Dibuja un rectángulo con bordes redondeados en el contexto 2D.
             */
            function roundRectPath(context, x, y, w, h, r) {
                const radius = Math.min(r, w / 2, h / 2);
                context.beginPath();
                context.moveTo(x + radius, y);
                context.arcTo(x + w, y, x + w, y + h, radius);
                context.arcTo(x + w, y + h, x, y + h, radius);
                context.arcTo(x, y + h, x, y, radius);
                context.arcTo(x, y, x + w, y, radius);
                context.closePath();
            }

            /**
             * Dibuja texto con espaciado personalizado entre letras (tracking).
             */
            function drawTrackedText(context, text, x, y, tracking, align) {
                const chars = Array.from(text);
                let totalWidth = 0;
                chars.forEach((ch, idx) => {
                    totalWidth += context.measureText(ch).width;
                    if (idx < chars.length - 1) totalWidth += tracking;
                });

                let curX = x;
                if (align === 'center') {
                    curX = x - totalWidth / 2;
                } else if (align === 'right') {
                    curX = x - totalWidth;
                }

                const prevAlign = context.textAlign;
                context.textAlign = 'left';
                chars.forEach((ch) => {
                    context.fillText(ch, curX, y);
                    curX += context.measureText(ch).width + tracking;
                });
                context.textAlign = prevAlign;
            }

            /**
             * Divide un texto en múltiples líneas que entren en maxWidth.
             */
            function wrapLines(context, text, maxWidth, maxLines) {
                const words = text.trim().split(/\s+/);
                const lines = [];
                let current = '';

                for (let i = 0; i < words.length; i++) {
                    const testLine = current ? `${current} ${words[i]}` : words[i];
                    if (context.measureText(testLine).width <= maxWidth) {
                        current = testLine;
                    } else {
                        if (current) {
                            lines.push(current);
                            current = words[i];
                        } else {
                            lines.push(words[i]);
                            current = '';
                        }
                        if (lines.length === maxLines - 1) {
                            const remaining = [current, ...words.slice(i + 1)].filter(Boolean).join(' ');
                            let truncated = remaining;
                            while (truncated.length > 3 && context.measureText(truncated).width > maxWidth) {
                                truncated = truncated.slice(0, -2) + '…';
                            }
                            lines.push(truncated);
                            return lines;
                        }
                    }
                }

                if (current) {
                    lines.push(current);
                }
                return lines.slice(0, maxLines);
            }

            /**
             * Dibuja la marca de agua geométrica "V" de VOLVER en el fondo.
             */
            function drawWatermarkV(context, W, H) {
                context.save();
                context.translate(W / 2, H / 2 - 20);
                context.scale(2.85, 2.85);
                context.translate(-100, -100);

                context.fillStyle = 'rgba(56, 189, 248, 0.032)';
                context.beginPath();
                context.moveTo(22, 30);
                context.lineTo(92, 175);
                context.lineTo(108, 175);
                context.lineTo(178, 30);
                context.lineTo(142, 30);
                context.lineTo(100, 120);
                context.lineTo(58, 30);
                context.closePath();
                context.fill();

                context.fillStyle = 'rgba(255, 255, 255, 0.028)';
                context.beginPath();
                context.moveTo(72, 30);
                context.lineTo(100, 90);
                context.lineTo(128, 30);
                context.lineTo(108, 30);
                context.lineTo(100, 48);
                context.lineTo(92, 30);
                context.closePath();
                context.fill();
                context.restore();
            }

            /**
             * Dibuja el logo SVG vectorial de VOLVER en el encabezado de la tarjeta.
             */
            function drawLogoV(context, x, y, size) {
                const scale = size / 40;
                context.save();
                context.translate(x, y);
                context.scale(scale, scale);

                context.fillStyle = '#FFFFFF';
                context.beginPath();
                context.moveTo(5, 7);
                context.lineTo(18.5, 34);
                context.lineTo(21.5, 34);
                context.lineTo(35, 7);
                context.lineTo(28.5, 7);
                context.lineTo(20, 24.5);
                context.lineTo(11.5, 7);
                context.closePath();
                context.fill();

                context.fillStyle = '#38BDF8';
                context.beginPath();
                context.moveTo(15.5, 7);
                context.lineTo(20, 16.5);
                context.lineTo(24.5, 7);
                context.lineTo(21.2, 7);
                context.lineTo(20, 9.6);
                context.lineTo(18.8, 7);
                context.closePath();
                context.fill();
                context.restore();
            }

            /**
             * Dibuja un ícono de tilde (check) para sesiones completadas.
             */
            function drawCheckIcon(context, cx, cy, size, color) {
                context.save();
                context.strokeStyle = color;
                context.lineWidth = 4.5;
                context.lineCap = 'round';
                context.lineJoin = 'round';
                context.beginPath();
                context.moveTo(cx - size * 0.42, cy + size * 0.04);
                context.lineTo(cx - size * 0.1, cy + size * 0.36);
                context.lineTo(cx + size * 0.44, cy - size * 0.32);
                context.stroke();
                context.restore();
            }

            /**
             * Dibuja una estrella de 5 puntas para la tarjeta del premio.
             */
            function drawStarIcon(context, cx, cy, outerR, innerR, fillStyle) {
                context.save();
                context.beginPath();
                for (let i = 0; i < 10; i++) {
                    const r = i % 2 === 0 ? outerR : innerR;
                    const angle = (Math.PI / 5) * i - Math.PI / 2;
                    const px = cx + Math.cos(angle) * r;
                    const py = cy + Math.sin(angle) * r;
                    if (i === 0) context.moveTo(px, py);
                    else context.lineTo(px, py);
                }
                context.closePath();
                context.fillStyle = fillStyle;
                context.fill();
                context.restore();
            }

            /**
             * Dibuja una de las 4 tarjetas de sesión dentro de la grilla 2x2.
             */
            function drawSessionCard(context, x, y, w, h, sessionNum) {
                const isRewardCard = sessionNum === 4;
                const isCompleted = state.session >= sessionNum;
                const isUnlocked = state.session === 4;
                const isNextReward = isRewardCard && state.session === 3;

                context.save();
                roundRectPath(context, x, y, w, h, 24);

                if (isRewardCard) {
                    if (isUnlocked) {
                        const grad = context.createLinearGradient(x, y, x + w, y + h);
                        grad.addColorStop(0, 'rgba(251, 191, 36, 0.22)');
                        grad.addColorStop(1, 'rgba(245, 158, 11, 0.08)');
                        context.fillStyle = grad;
                        context.shadowColor = 'rgba(251, 191, 36, 0.28)';
                        context.shadowBlur = 24;
                        context.fill();
                        context.shadowBlur = 0;
                        context.strokeStyle = 'rgba(251, 191, 36, 0.85)';
                        context.lineWidth = 2.5;
                        context.stroke();
                    } else if (isNextReward) {
                        context.fillStyle = 'rgba(251, 191, 36, 0.1)';
                        context.fill();
                        context.strokeStyle = 'rgba(251, 191, 36, 0.55)';
                        context.lineWidth = 2;
                        context.stroke();
                    } else {
                        context.fillStyle = 'rgba(251, 191, 36, 0.045)';
                        context.fill();
                        context.strokeStyle = 'rgba(251, 191, 36, 0.24)';
                        context.lineWidth = 1.6;
                        context.stroke();
                    }
                } else if (isCompleted) {
                    const grad = context.createLinearGradient(x, y, x + w, y + h);
                    grad.addColorStop(0, 'rgba(56, 189, 248, 0.18)');
                    grad.addColorStop(1, 'rgba(14, 165, 233, 0.05)');
                    context.fillStyle = grad;
                    context.shadowColor = 'rgba(56, 189, 248, 0.2)';
                    context.shadowBlur = 18;
                    context.fill();
                    context.shadowBlur = 0;
                    context.strokeStyle = 'rgba(56, 189, 248, 0.72)';
                    context.lineWidth = 2.2;
                    context.stroke();
                } else {
                    context.fillStyle = 'rgba(19, 26, 36, 0.82)';
                    context.fill();
                    context.strokeStyle = 'rgba(255, 255, 255, 0.09)';
                    context.lineWidth = 1.6;
                    context.stroke();
                }

                // Círculo indicador superior izquierdo
                const circleX = x + 52;
                const circleY = y + 54;
                const circleR = 26;

                context.beginPath();
                context.arc(circleX, circleY, circleR, 0, Math.PI * 2);
                if (isRewardCard) {
                    context.fillStyle = isUnlocked ? '#FBBF24' : 'rgba(251, 191, 36, 0.16)';
                    context.fill();
                    drawStarIcon(context, circleX, circleY, 13, 6, isUnlocked ? '#0B0F15' : '#FBBF24');
                } else if (isCompleted) {
                    context.fillStyle = '#38BDF8';
                    context.fill();
                    drawCheckIcon(context, circleX, circleY, 22, '#0B0F15');
                } else {
                    context.fillStyle = 'rgba(255, 255, 255, 0.06)';
                    context.fill();
                    context.strokeStyle = 'rgba(255, 255, 255, 0.14)';
                    context.lineWidth = 1.5;
                    context.stroke();

                    context.fillStyle = '#64748B';
                    context.font = `700 22px ${FONT_FAMILY}`;
                    context.textAlign = 'center';
                    context.textBaseline = 'middle';
                    context.fillText(String(sessionNum), circleX, circleY + 1);
                }

                // Etiqueta de estado superior derecha
                let statusLabel = 'PENDIENTE';
                let statusBg = 'rgba(255, 255, 255, 0.05)';
                let statusColor = '#64748B';

                if (isRewardCard) {
                    if (isUnlocked) {
                        statusLabel = 'DESBLOQUEADO';
                        statusBg = 'rgba(251, 191, 36, 0.22)';
                        statusColor = '#FDE68A';
                    } else if (isNextReward) {
                        statusLabel = 'PRÓXIMA SESIÓN';
                        statusBg = 'rgba(251, 191, 36, 0.18)';
                        statusColor = '#FBBF24';
                    } else {
                        statusLabel = 'PREMIO';
                        statusBg = 'rgba(251, 191, 36, 0.12)';
                        statusColor = '#FBBF24';
                    }
                } else if (isCompleted) {
                    statusLabel = 'COMPLETADA';
                    statusBg = 'rgba(56, 189, 248, 0.18)';
                    statusColor = '#7DD3FC';
                }

                context.font = `700 13px ${FONT_FAMILY}`;
                const badgeTextW = context.measureText(statusLabel).width;
                const badgeW = badgeTextW + 24;
                const badgeH = 30;
                const badgeX = x + w - badgeW - 22;
                const badgeY = y + 39;

                roundRectPath(context, badgeX, badgeY, badgeW, badgeH, 15);
                context.fillStyle = statusBg;
                context.fill();

                context.fillStyle = statusColor;
                context.textAlign = 'center';
                context.textBaseline = 'middle';
                context.fillText(statusLabel, badgeX + badgeW / 2, badgeY + badgeH / 2 + 0.5);

                // Título de la tarjeta
                context.textAlign = 'left';
                context.textBaseline = 'alphabetic';
                if (isRewardCard) {
                    context.fillStyle = isUnlocked ? '#FDE68A' : '#FBBF24';
                    context.font = `800 22px ${FONT_FAMILY}`;
                    context.fillText('SESIÓN 4 • PREMIO', x + 28, y + 124);

                    const rewardLabel = (state.reward || 'Ozonoterapia de regalo').trim();
                    context.fillStyle = isUnlocked ? '#FFFFFF' : '#E2E8F0';
                    context.font = `600 21px ${FONT_FAMILY}`;
                    const rewardLines = wrapLines(context, rewardLabel, w - 56, 2);
                    rewardLines.forEach((line, idx) => {
                        context.fillText(line, x + 28, y + 156 + idx * 26);
                    });
                } else {
                    context.fillStyle = isCompleted ? '#FFFFFF' : '#CBD5E1';
                    context.font = `800 26px ${FONT_FAMILY}`;
                    context.fillText(`SESIÓN ${sessionNum}`, x + 28, y + 130);

                    const subLabels = {
                        1: isCompleted ? 'Inicio del protocolo' : 'Primer paso',
                        2: isCompleted ? 'Avance consolidado' : 'Continuidad activa',
                        3: isCompleted ? 'Camino al beneficio' : 'Consolidación'
                    };
                    context.fillStyle = isCompleted ? '#94A3B8' : '#64748B';
                    context.font = `500 18.5px ${FONT_FAMILY}`;
                    context.fillText(subLabels[sessionNum], x + 28, y + 162);
                }

                context.restore();
            }

            // =========================================================================
            // RENDER PRINCIPAL DEL CANVAS (1080 x 1080)
            // =========================================================================
            function renderCard() {
                const W = canvas.width;
                const H = canvas.height;
                const gridX = 68;

                // 1. FONDO OSCURO CLÍNICO
                const bgGrad = ctx.createLinearGradient(0, 0, W, H);
                bgGrad.addColorStop(0, '#0D131D');
                bgGrad.addColorStop(0.5, '#0B0F15');
                bgGrad.addColorStop(1, '#101826');
                ctx.fillStyle = bgGrad;
                ctx.fillRect(0, 0, W, H);

                // Luces ambientales sutiles
                const cyanGlow = ctx.createRadialGradient(180, 120, 10, 180, 120, 480);
                cyanGlow.addColorStop(0, 'rgba(56, 189, 248, 0.14)');
                cyanGlow.addColorStop(1, 'rgba(56, 189, 248, 0)');
                ctx.fillStyle = cyanGlow;
                ctx.fillRect(0, 0, W, H);

                const goldGlow = ctx.createRadialGradient(900, 860, 10, 900, 860, 440);
                goldGlow.addColorStop(0, 'rgba(251, 191, 36, 0.09)');
                goldGlow.addColorStop(1, 'rgba(251, 191, 36, 0)');
                ctx.fillStyle = goldGlow;
                ctx.fillRect(0, 0, W, H);

                // 2. MARCO EXTERIOR SUTIL
                roundRectPath(ctx, 26, 26, W - 52, H - 52, 36);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.lineWidth = 2;
                ctx.stroke();

                // 3. MARCA DE AGUA "V"
                drawWatermarkV(ctx, W, H);

                // 4. ENCABEZADO VOLVER + BADGE
                drawLogoV(ctx, gridX, 66, 56);

                ctx.textAlign = 'left';
                ctx.textBaseline = 'alphabetic';
                ctx.fillStyle = '#FFFFFF';
                ctx.font = `800 32px ${FONT_FAMILY}`;
                drawTrackedText(ctx, 'VOLVER', gridX + 70, 98, 6.5, 'left');

                ctx.fillStyle = '#38BDF8';
                ctx.font = `600 13.5px ${FONT_FAMILY}`;
                drawTrackedText(ctx, 'RECUPERACIÓN REAL', gridX + 71, 121, 3.2, 'left');

                // Pastilla derecha "PASAPORTE DE RECUPERACIÓN"
                const pillW = 310;
                const pillH = 44;
                const pillX = W - gridX - pillW;
                const pillY = 72;

                roundRectPath(ctx, pillX, pillY, pillW, pillH, 22);
                ctx.fillStyle = 'rgba(56, 189, 248, 0.1)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
                ctx.lineWidth = 1.5;
                ctx.stroke();

                ctx.fillStyle = '#7DD3FC';
                ctx.font = `700 13.5px ${FONT_FAMILY}`;
                ctx.textBaseline = 'middle';
                drawTrackedText(ctx, 'PASAPORTE DE RECUPERACIÓN', pillX + pillW / 2, pillY + pillH / 2 + 0.5, 1.4, 'center');

                // Línea divisoria superior
                const topDiv = ctx.createLinearGradient(gridX, 152, W - gridX, 152);
                topDiv.addColorStop(0, 'rgba(56, 189, 248, 0.35)');
                topDiv.addColorStop(0.5, 'rgba(255, 255, 255, 0.12)');
                topDiv.addColorStop(1, 'rgba(255, 255, 255, 0.02)');
                ctx.strokeStyle = topDiv;
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.moveTo(gridX, 152);
                ctx.lineTo(W - gridX, 152);
                ctx.stroke();

                // 5. BLOQUE DE PACIENTE Y ZONA
                const patientDisplay = state.name.trim() || 'Tu Pasaporte';
                const zoneDisplay = state.zone.trim() || 'Protocolo de 4 Sesiones';

                ctx.textBaseline = 'alphabetic';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#94A3B8';
                ctx.font = `600 15px ${FONT_FAMILY}`;
                drawTrackedText(ctx, 'PACIENTE', gridX, 200, 3, 'left');

                ctx.fillStyle = '#FFFFFF';
                ctx.font = `800 50px ${FONT_FAMILY}`;
                ctx.fillText(patientDisplay, gridX, 256);

                // Pastilla de zona / foco
                ctx.font = `600 19px ${FONT_FAMILY}`;
                const zoneTextW = ctx.measureText(zoneDisplay).width;
                const zonePillW = Math.min(W - gridX * 2, zoneTextW + 46);
                const zonePillH = 42;
                const zonePillY = 276;

                roundRectPath(ctx, gridX, zonePillY, zonePillW, zonePillH, 21);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
                ctx.fill();
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.1)';
                ctx.lineWidth = 1.2;
                ctx.stroke();

                // Punto cian dentro de la pastilla de zona
                ctx.fillStyle = '#38BDF8';
                ctx.beginPath();
                ctx.arc(gridX + 20, zonePillY + zonePillH / 2, 4.5, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#CBD5E1';
                ctx.textBaseline = 'middle';
                ctx.fillText(zoneDisplay, gridX + 34, zonePillY + zonePillH / 2 + 1);

                // 5B. GRILLA 2x2 DE SESIONES
                const gap = 24;
                const cardW = (W - gridX * 2 - gap) / 2;
                const cardH = 196;
                const startGridY = 348;

                drawSessionCard(ctx, gridX, startGridY, cardW, cardH, 1);
                drawSessionCard(ctx, gridX + cardW + gap, startGridY, cardW, cardH, 2);
                drawSessionCard(ctx, gridX, startGridY + cardH + gap, cardW, cardH, 3);
                drawSessionCard(ctx, gridX + cardW + gap, startGridY + cardH + gap, cardW, cardH, 4);

                // 6. BARRA DE PROGRESO HORIZONTAL
                const progY = 788;
                const barW = W - gridX * 2;
                const pct = state.session * 25;

                ctx.textBaseline = 'alphabetic';
                ctx.textAlign = 'left';
                ctx.fillStyle = '#CBD5E1';
                ctx.font = `600 19.5px ${FONT_FAMILY}`;
                ctx.fillText(`Progreso: ${state.session} de 4 sesiones`, gridX, progY + 16);

                ctx.textAlign = 'right';
                ctx.fillStyle = state.session >= 3 ? '#FBBF24' : '#38BDF8';
                ctx.font = `800 20.5px ${FONT_FAMILY}`;
                ctx.fillText(`${pct}%`, W - gridX, progY + 16);

                // Track de la barra
                const barY = progY + 30;
                const barH = 14;
                roundRectPath(ctx, gridX, barY, barW, barH, 7);
                ctx.fillStyle = 'rgba(255, 255, 255, 0.08)';
                ctx.fill();

                // Relleno degradado cian -> dorado
                const fillW = Math.max(24, (barW * pct) / 100);
                const barGrad = ctx.createLinearGradient(gridX, barY, gridX + barW, barY);
                barGrad.addColorStop(0, '#38BDF8');
                barGrad.addColorStop(0.65, '#38BDF8');
                barGrad.addColorStop(1, '#FBBF24');

                ctx.save();
                roundRectPath(ctx, gridX, barY, fillW, barH, 7);
                ctx.fillStyle = barGrad;
                ctx.shadowColor = state.session >= 3 ? 'rgba(251, 191, 36, 0.45)' : 'rgba(56, 189, 248, 0.45)';
                ctx.shadowBlur = 14;
                ctx.fill();
                ctx.restore();

                // 7. BANNER MOTIVACIONAL INFERIOR DINÁMICO
                const bannerMessages = {
                    1: '¡Gran primer paso! Te faltan 2 sesiones para desbloquear tu beneficio.',
                    2: '¡Vas por la mitad! A solo 1 sesión de desbloquear tu beneficio.',
                    3: '¡Constancia cumplida! En tu próxima visita tenés tu beneficio de regalo.',
                    4: '¡Protocolo completado! Gracias por confiar en VOLVER.'
                };
                const bannerText = bannerMessages[state.session];
                const bannerY = 852;
                const bannerH = 80;
                const isGoldBanner = state.session >= 3;

                ctx.save();
                roundRectPath(ctx, gridX, bannerY, barW, bannerH, 18);
                ctx.fillStyle = isGoldBanner ? 'rgba(251, 191, 36, 0.1)' : 'rgba(56, 189, 248, 0.09)';
                ctx.fill();
                ctx.strokeStyle = isGoldBanner ? 'rgba(251, 191, 36, 0.35)' : 'rgba(56, 189, 248, 0.28)';
                ctx.lineWidth = 1.8;
                ctx.stroke();

                // Barra de acento vertical izquierda dentro del banner
                roundRectPath(ctx, gridX + 14, bannerY + 16, 6, bannerH - 32, 3);
                ctx.fillStyle = isGoldBanner ? '#FBBF24' : '#38BDF8';
                ctx.fill();

                // Texto con salto de línea automático
                ctx.fillStyle = '#F8FAFC';
                ctx.font = `600 20.5px ${FONT_FAMILY}`;
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                const bLines = wrapLines(ctx, bannerText, barW - 72, 2);
                const lineH = 27;
                const totalTextH = (bLines.length - 1) * lineH;
                const startTextY = bannerY + bannerH / 2 - totalTextH / 2;

                bLines.forEach((line, idx) => {
                    ctx.fillText(line, gridX + 38, startTextY + idx * lineH);
                });
                ctx.restore();

                // 8. PIE DE TARJETA ENFOCADO EN EL PACIENTE
                const footerDivGrad = ctx.createLinearGradient(W / 2 - 220, 950, W / 2 + 220, 950);
                footerDivGrad.addColorStop(0, 'rgba(56, 189, 248, 0)');
                footerDivGrad.addColorStop(0.5, 'rgba(56, 189, 248, 0.4)');
                footerDivGrad.addColorStop(1, 'rgba(56, 189, 248, 0)');
                ctx.strokeStyle = footerDivGrad;
                ctx.lineWidth = 1.4;
                ctx.beginPath();
                ctx.moveTo(W / 2 - 220, 950);
                ctx.lineTo(W / 2 + 220, 950);
                ctx.stroke();

                const sloganRaw = (state.footerSlogan || DEFAULT_SLOGAN).trim();
                ctx.save();
                ctx.font = `500 19.5px ${FONT_FAMILY}`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

                const sloganLines = wrapLines(ctx, sloganRaw, W - 210, 2);
                const isTwoLines = sloganLines.length > 1;
                const sloganStartY = isTwoLines ? 973 : 982;
                const sloganLineH = 24;

                if (!isTwoLines) {
                    const textW = ctx.measureText(sloganLines[0]).width;
                    const dotOffset = textW / 2 + 18;
                    ctx.fillStyle = 'rgba(56, 189, 248, 0.75)';
                    ctx.beginPath();
                    ctx.arc(W / 2 - dotOffset, sloganStartY, 3, 0, Math.PI * 2);
                    ctx.arc(W / 2 + dotOffset, sloganStartY, 3, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.fillStyle = '#E2E8F0';
                sloganLines.forEach((line, idx) => {
                    ctx.fillText(line, W / 2, sloganStartY + idx * sloganLineH);
                });

                ctx.fillStyle = '#64748B';
                ctx.font = `600 11.5px ${FONT_FAMILY}`;
                drawTrackedText(ctx, 'GABRIEL CHAYA   •   VOLVER', W / 2, 1024, 2.6, 'center');
                ctx.restore();
            }

            // =========================================================================

                    if (isSelected) {
                        if (num === 4) {
                            btn.classList.add('bg-amber-400/15', 'border-amber-400', 'text-amber-200', 'ring-1', 'ring-amber-400/40');
                            badge.classList.add('bg-amber-400', 'text-slate-950');
                        } else {
                            btn.classList.add('bg-sky-400/15', 'border-sky-400', 'text-sky-100', 'ring-1', 'ring-sky-400/40');
                            badge.classList.add('bg-sky-400', 'text-slate-950');
                        }
                    } else {
                        btn.classList.add('bg-[#0B0F15]/80', 'border-white/[0.08]', 'text-slate-300', 'hover:border-white/20');
                        badge.classList.add('bg-white/[0.08]', 'text-slate-400');
                    }
                });
            }

            function updateSloganChipsUI() {
                const current = state.footerSlogan.trim();
                sloganChips.forEach((chip) => {
                    const val = chip.getAttribute('data-slogan');
                    const isActive = val === current;

                    chip.className = 'slogan-chip px-2.5 py-1.5 rounded-lg text-[11px] font-medium border text-left transition-all duration-150 active:scale-[0.98]';
                    if (isActive) {
                        chip.classList.add('bg-sky-400/15', 'border-sky-400/70', 'text-sky-200');
                    } else {
                        chip.classList.add('bg-[#0B0F15]/80', 'border-white/[0.08]', 'text-slate-400', 'hover:border-white/20', 'hover:text-slate-200');
                    }
                });
            }

            function syncAll() {
                updateSessionButtonsUI();
                updateSloganChipsUI();
                wppMessagePreview.textContent = buildWhatsAppMessage();
                renderCard();
            }

            function showToast(msg) {
                toastTextEl.textContent = msg;
                toastEl.classList.remove('opacity-0', 'translate-y-3');
                toastEl.classList.add('opacity-100', 'translate-y-0');

                if (toastTimer) clearTimeout(toastTimer);
                toastTimer = setTimeout(() => {
                    toastEl.classList.remove('opacity-100', 'translate-y-0');
                    toastEl.classList.add('opacity-0', 'translate-y-3');
                }, 2500);
            }

            function getFileName() {
                const slug = (state.name.trim() || 'paciente')
                    .toLowerCase()
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9]+/g, '-')
                    .replace(/^-+|-+$/g, '');
                return `pasaporte-volver-${slug || 'paciente'}-s${state.session}.png`;
            }

            function downloadCanvasPNG() {
                try {
                    const dataUrl = canvas.toDataURL('image/png');
                    const link = document.createElement('a');
                    link.download = getFileName();
                    link.href = dataUrl;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('Tarjeta descargada en PNG');
                } catch (err) {
                    console.error('Error al descargar PNG:', err);
                    showToast('No se pudo descargar la imagen');
                }
            }

            // =========================================================================
            // EVENTOS
            // =========================================================================
            nameInput.addEventListener('input', (e) => {
                state.name = e.target.value;
                syncAll();
            });

            zoneInput.addEventListener('input', (e) => {
                state.zone = e.target.value;
                syncAll();
            });

            sessionBtns.forEach((btn) => {
                btn.addEventListener('click', () => {
                    state.session = parseInt(btn.getAttribute('data-session'), 10);
                    syncAll();
                });
            });

            rewardPreset.addEventListener('change', (e) => {
                const val = e.target.value;
                if (val === 'custom') {
                    rewardInput.focus();
                    rewardInput.select();
                } else {
                    state.reward = val;
                    rewardInput.value = val;
                    syncAll();
                }
            });

            rewardInput.addEventListener('input', (e) => {
                const val = e.target.value;
                state.reward = val;
                const presets = ['Ozonoterapia de regalo', 'Sesión de Ozono de refuerzo', 'Beneficio en mantenimiento'];
                rewardPreset.value = presets.includes(val) ? val : 'custom';
                syncAll();
            });

            footerSloganInput.addEventListener('input', (e) => {
                state.footerSlogan = e.target.value;
                syncAll();
            });

            sloganChips.forEach((chip) => {
                chip.addEventListener('click', () => {
                    const selected = chip.getAttribute('data-slogan');
                    state.footerSlogan = selected;
                    footerSloganInput.value = selected;
                    syncAll();
                });
            });

            resetBtn.addEventListener('click', () => {
                state.name = '';
                state.zone = '';
                state.session = 1;
                state.reward = 'Ozonoterapia de regalo';
                state.footerSlogan = DEFAULT_SLOGAN;
                nameInput.value = '';
                zoneInput.value = '';
                rewardPreset.value = 'Ozonoterapia de regalo';
                rewardInput.value = 'Ozonoterapia de regalo';
                footerSloganInput.value = DEFAULT_SLOGAN;
                syncAll();
                showToast('Campos reiniciados');
            });

            downloadBtn.addEventListener('click', downloadCanvasPNG);

            shareBtn.addEventListener('click', () => {
                try {
                    canvas.toBlob(async (blob) => {
                        if (!blob) {
                            downloadCanvasPNG();
                            return;
                        }
                        const file = new File([blob], getFileName(), { type: 'image/png' });
                        const shareData = {
                            files: [file],
                            title: 'Pasaporte de Recuperación VOLVER',
                            text: buildWhatsAppMessage()
                        };

                        if (navigator.canShare && navigator.canShare({ files: [file] })) {
                            try {
                                await navigator.share(shareData);
                                showToast('Compartido correctamente');
                            } catch (shareErr) {
                                if (shareErr && shareErr.name !== 'AbortError') {
                                    downloadCanvasPNG();
                                }
                            }
                        } else {
                            downloadCanvasPNG();
                            showToast('Descargada: adjuntala directo en WhatsApp');
                        }
                    }, 'image/png');
                } catch (err) {
                    console.error('Error al compartir:', err);
                    downloadCanvasPNG();
                }
            });

            copyMsgBtn.addEventListener('click', () => {
                const message = buildWhatsAppMessage();
                try {
                    const tempArea = document.createElement('textarea');
                    tempArea.value = message;
                    tempArea.setAttribute('readonly', '');
                    tempArea.style.position = 'fixed';
                    tempArea.style.opacity = '0';
                    document.body.appendChild(tempArea);
                    tempArea.select();
                    tempArea.setSelectionRange(0, 99999);
                    document.execCommand('copy');
                    document.body.removeChild(tempArea);

                    copyBtnLabel.textContent = '¡Mensaje copiado!';
                    showToast('Mensaje copiado para WhatsApp');
                    setTimeout(() => {
                        copyBtnLabel.textContent = 'Copiar mensaje para WhatsApp';
                    }, 1800);
                } catch (err) {
                    console.error('Error al copiar:', err);
                    showToast('No se pudo copiar automáticamente');
                }
            });

            // =========================================================================
            // INICIALIZACIÓN
            // =========================================================================
            syncAll();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(() => {
                    renderCard();
                });
            }
        })();
    </script>
</body>
</html>
